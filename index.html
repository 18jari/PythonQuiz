<html>
<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Python Datastructuren</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #e6f0fa; /* Zachtblauwe achtergrond */
            color: #000000; /* Zwarte tekst */
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .card {
            background-color: #ffffff;
            border: 2px solid #000000;
            border-radius: 8px;
            width: 100%;
            max-width: 650px;
            padding: 25px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        header {
            border-bottom: 2px solid #000000;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.4rem;
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #333333;
        }

        .progress {
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 1rem;
        }

        .question-text {
            font-size: 1.1rem;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        pre {
            background-color: #f0f4f8;
            border: 1px solid #000000;
            padding: 10px;
            border-radius: 4px;
            font-family: "Courier New", Courier, monospace;
            margin: 10px 0;
            overflow-x: auto;
        }

        code {
            font-family: "Courier New", Courier, monospace;
            background-color: #f0f4f8;
            padding: 2px 4px;
            border-radius: 3px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 12px;
            border: 1px solid #000000;
            border-radius: 6px;
            cursor: pointer;
            background-color: #ffffff;
            transition: background-color 0.15s;
        }

        .option-label:hover {
            background-color: #dbeafe;
        }

        .option-label input[type="radio"] {
            margin-right: 12px;
            width: 18px;
            height: 18px;
            accent-color: #000000;
            cursor: pointer;
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        button {
            background-color: #000000;
            color: #ffffff;
            border: 2px solid #000000;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #ffffff;
            color: #000000;
        }

        button:disabled {
            background-color: #cccccc;
            color: #666666;
            border-color: #cccccc;
            cursor: not-allowed;
        }

        /* Screens */
        #quiz-screen, #result-screen, #exit-screen {
            display: none;
        }

        .score-box {
            border: 2px solid #000000;
            background-color: #e6f0fa;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .error-item {
            border: 1px solid #000000;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 12px;
            background-color: #fff0f0;
        }

        .error-title {
            font-weight: bold;
            margin-bottom: 6px;
        }

        .given-ans {
            color: #cc0000;
        }

        .correct-ans {
            color: #008000;
            font-weight: bold;
        }

        .no-errors {
            border: 1px solid #000000;
            background-color: #e6ffe6;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .action-btn-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .exit-msg {
            text-align: center;
            padding: 20px 0;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <div class="card">
        <header>
            <h1>Quiz: Python Datastructuren</h1>
            <p class="subtitle">Gebaseerd op <i>"De Programmeursleerling"</i> (Pieter Spronck)</p>
        </header>

        <!-- VRAGEN SCHERM -->
        <div id="quiz-screen" style="display: block;">
            <div class="progress" id="progress-text">Vraag 1 van 5</div>
            <div class="question-text" id="question-text"></div>
            <div class="options" id="options-container"></div>

            <div class="navigation">
                <button id="prev-btn" onclick="prevQuestion()" disabled>Vorige</button>
                <button id="next-btn" onclick="nextQuestion()">Volgende</button>
            </div>
        </div>

        <!-- RESULTATEN SCHERM -->
        <div id="result-screen">
            <h2>Resultaat</h2>
            <br>
            <div class="score-box" id="score-text"></div>
            
            <h3 id="review-header">Overzicht van foutieve en niet-ingevulde antwoorden:</h3>
            <br>
            <div id="errors-container"></div>

            <div class="action-btn-container">
                <button onclick="restartQuiz()">Quiz opnieuw doen</button>
                <button onclick="exitQuiz()">Quiz verlaten</button>
            </div>
        </div>

        <!-- AFSLUIT SCHERM -->
        <div id="exit-screen">
            <div class="exit-msg">
                <h2>Bedankt voor het meedoen!</h2>
                <br>
                <p>Je hebt de quiz verlaten. Sluit dit venster of het tabblad om af te ronden.</p>
            </div>
            <div class="action-btn-container">
                <button onclick="restartQuiz()">Alsnog opnieuw proberen</button>
            </div>
        </div>
    </div>

    <script>
        const quizData = [
            {
                question: "Wat is volgens <i>De Programmeursleerling</i> het fundamentele verschil tussen een List en een Tuple?",
                options: [
                    "Een list is veranderbaar (mutable), terwijl een tuple onveranderbaar (immutable) is.",
                    "Een list bevat alleen getallen, een tuple kan ook strings bevatten.",
                    "Een tuple is geordend, maar een list is ongeordend.",
                    "Een tuple gebruikt vierkante haken [ ], een list gebruikt ronde haken ( )."
                ],
                correct: 0
            },
            {
                question: "Welke methode gebruik je om een nieuw element aan het einde van een bestaande List toe te voegen?",
                options: [
                    "add()",
                    "insert()",
                    "append()",
                    "extend()"
                ],
                correct: 2
            },
            {
                question: "Wat gebeurt er als je de volgende code uitvoert?<br><pre>tup = (1, 2, 3)\ntup[0] = 99</pre>",
                options: [
                    "De tuple verandert in (99, 2, 3).",
                    "Er ontstaat een TypeError (runtime error) omdat tuples niet aangepast kunnen worden.",
                    "Er wordt automatisch een nieuwe list aangemaakt met waarde 99.",
                    "Het getal 99 wordt achteraan toegevoegd."
                ],
                correct: 1
            },
            {
                question: "Hoe maak je een lege <b>Dictionary</b> aan in Python?",
                options: [
                    "d = []",
                    "d = {}",
                    "d = dict[]",
                    "d = set()"
                ],
                correct: 1
            },
            {
                question: "Welk van de volgende datatypes kan <b>NIET</b> als een Key gebruikt worden in een Dictionary?",
                options: [
                    "String",
                    "Integer",
                    "Tuple",
                    "List"
                ],
                correct: 3
            }
        ];

        let currentQuestion = 0;
        let userAnswers = new Array(quizData.length).fill(null);

        function renderQuestion() {
            const q = quizData[currentQuestion];
            document.getElementById('progress-text').innerText = `Vraag ${currentQuestion + 1} van ${quizData.length}`;
            document.getElementById('question-text').innerHTML = q.question;

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            q.options.forEach((opt, index) => {
                const label = document.createElement('label');
                label.className = 'option-label';

                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.name = 'quiz-option';
                radio.value = index;

                if (userAnswers[currentQuestion] === index) {
                    radio.checked = true;
                }

                radio.addEventListener('change', () => {
                    userAnswers[currentQuestion] = index;
                });

                label.appendChild(radio);
                label.appendChild(document.createTextNode(opt));
                optionsContainer.appendChild(label);
            });

            document.getElementById('prev-btn').disabled = (currentQuestion === 0);
            
            const nextBtn = document.getElementById('next-btn');
            if (currentQuestion === quizData.length - 1) {
                nextBtn.innerText = "Indienen";
            } else {
                nextBtn.innerText = "Volgende";
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                renderQuestion();
            }
        }

        function nextQuestion() {
            if (currentQuestion < quizData.length - 1) {
                currentQuestion++;
                renderQuestion();
            } else {
                finishQuiz();
            }
        }

        function finishQuiz() {
            document.getElementById('quiz-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';

            let score = 0;
            const errorsContainer = document.getElementById('errors-container');
            errorsContainer.innerHTML = '';

            let hasErrors = false;

            quizData.forEach((q, index) => {
                const answered = userAnswers[index];
                if (answered === q.correct) {
                    score++;
                } else {
                    hasErrors = true;
                    const errorDiv = document.createElement('div');
                    errorDiv.className = 'error-item';

                    const givenText = (answered !== null) ? q.options[answered] : "<i>Niet ingevuld</i>";

                    errorDiv.innerHTML = `
                        <div class="error-title">Vraag ${index + 1}: ${q.question}</div>
                        <div>Jouw antwoord: <span class="given-ans">${givenText}</span></div>
                        <div>Juist antwoord: <span class="correct-ans">${q.options[q.correct]}</span></div>
                    `;
                    errorsContainer.appendChild(errorDiv);
                }
            });

            document.getElementById('score-text').innerText = `Jouw totale score: ${score} / ${quizData.length}`;

            if (!hasErrors) {
                document.getElementById('review-header').style.display = 'none';
                errorsContainer.innerHTML = '<div class="no-errors">Uitstekend! Je hebt alle vragen correct beantwoord!</div>';
            } else {
                document.getElementById('review-header').style.display = 'block';
            }
        }

        function restartQuiz() {
            currentQuestion = 0;
            userAnswers.fill(null);
            document.getElementById('result-screen').style.display = 'none';
            document.getElementById('exit-screen').style.display = 'none';
            document.getElementById('quiz-screen').style.display = 'block';
            renderQuestion();
        }

        function exitQuiz() {
            document.getElementById('result-screen').style.display = 'none';
            document.getElementById('exit-screen').style.display = 'block';
        }

        renderQuestion();
    </script>
</body>
</html>
